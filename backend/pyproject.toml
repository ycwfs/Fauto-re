[project]
name = "full-auto-research-backend"
version = "0.1.0"
description = "Full-Auto-Research Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "stripe>=11.1.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "arxiv>=2.1.3",
    "openai>=1.54.4",
    "anthropic>=0.39.0",
    "nltk>=3.9.1",
    "jieba>=0.42.1",
    "scikit-learn>=1.5.2",
    "wordcloud>=1.9.3",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
    "apscheduler>=3.10.4",
    "pytz>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
