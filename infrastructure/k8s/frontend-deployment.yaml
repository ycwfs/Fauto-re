apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: full-auto-research
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: full-auto-research
      component: frontend
  template:
    metadata:
      labels:
        app: full-auto-research
        component: frontend
    spec:
      containers:
      - name: frontend
        image: registry.digitalocean.com/full-auto-research/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "https://api.full-auto-research.com"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: full-auto-research
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: full-auto-research
    component: frontend
